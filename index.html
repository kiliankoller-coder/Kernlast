<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Kernlast</title>
<meta name="theme-color" content="#0E141B" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kernlast" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<style>
:root{
  --bg:#070B0F; --ink:#0E141B; --ink2:#121A23; --surface:#16202B; --surface2:#1B2733;
  --line:#283643; --line-soft:#202C38; --bone:#EAF1F7; --ash:#8DA0B2; --ash-dim:#5E7384;
  --accent:#4C8DFF; --accent-soft:rgba(76,141,255,.12); --on-accent:#fff;
  --green:#2FBF71; --amber:#FFB020; --red:#FF6B61;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--bg);font-family:var(--sans);color:var(--bone);-webkit-font-smoothing:antialiased;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
#app{height:100%;}
.kl-shell{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;
  background:var(--ink);border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}
.kl-main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.ash{color:var(--ash);}
.small{font-size:12px;}

.kl-header{display:flex;align-items:center;justify-content:space-between;
  padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line-soft);background:var(--ink);flex-shrink:0;}
.kl-brand{font-weight:800;font-size:16px;letter-spacing:.22em;}
.kl-date{color:var(--ash);font-size:12px;margin-top:3px;display:flex;align-items:center;gap:7px;}
.kl-backtoday{background:var(--surface);border:1px solid var(--line);color:var(--accent);
  font-size:10.5px;border-radius:999px;padding:2px 8px;cursor:pointer;font-family:var(--sans);}
.kl-streak{display:flex;align-items:center;gap:6px;background:var(--surface);
  border:1px solid var(--line);padding:6px 11px;border-radius:999px;font-size:14px;}
.kl-streak svg{width:17px;height:17px;}

.kl-page{padding:15px 15px 28px;}
.kl-pad{padding:0 4px;}
.kl-card{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px;}
.kl-eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ash-dim);}
.kl-h1{font-size:25px;font-weight:800;margin-top:3px;}
.kl-h2{font-size:15px;font-weight:700;}
.kl-sub-note{font-size:12px;line-height:1.45;margin:6px 4px 12px;color:var(--ash);}
.kl-body{color:var(--ash);font-size:13px;line-height:1.55;margin:0 0 10px;}
.kl-empty{font-size:12.5px;color:var(--ash);padding:16px 0;line-height:1.45;}
.kl-sec-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}

/* session */
.kl-session-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.kl-meta-num{display:flex;flex-direction:column;align-items:flex-end;flex-shrink:0;}
.kl-meta-num .mono{font-size:19px;font-weight:700;}
.kl-ex{border-top:1px solid var(--line-soft);padding:14px 0;}
.kl-ex:first-of-type{border-top:none;}
.kl-ex-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px;}
.kl-ex-name{font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.kl-ex-last{font-size:11.5px;color:var(--ash-dim);margin-top:4px;line-height:1.4;}
.kl-sug{font-size:11.5px;margin-top:5px;line-height:1.4;font-weight:600;}
.kl-ex-cnt{font-size:13px;color:var(--ash);white-space:nowrap;}
.kl-sets{display:flex;flex-direction:column;gap:7px;}
.kl-set-hdr,.kl-setrow{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:8px;align-items:center;}
.kl-set-hdr{font-size:10px;color:var(--ash-dim);text-transform:uppercase;letter-spacing:.08em;padding:0 2px;margin-bottom:6px;}
.kl-set-i{font-family:var(--mono);color:var(--ash);font-size:13px;text-align:center;display:flex;flex-direction:column;align-items:center;line-height:1;}
.kl-set-i small{font-size:10px;margin-top:2px;}
.kl-num{background:var(--ink2);border:1px solid var(--line);border-radius:9px;padding:10px 8px;
  color:var(--bone);font-size:15px;font-family:var(--mono);text-align:center;width:100%;}
.kl-num:focus{outline:none;border-color:var(--accent);}
.kl-num::placeholder{color:var(--ash-dim);}
.kl-setrow.done .kl-num{border-color:transparent;background:var(--surface2);}
.kl-set-done{height:38px;border-radius:9px;border:1.5px solid var(--line);background:transparent;
  color:#06240f;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s;}
.kl-set-done svg{width:18px;height:18px;}
.kl-set-done.on{background:var(--green);border-color:var(--green);}
.kl-set-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.kl-mini{background:var(--ink2);border:1px solid var(--line);color:var(--ash);border-radius:8px;
  padding:7px 11px;font-size:12px;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:5px;}
.kl-mini svg{width:13px;height:13px;}
.kl-mini.danger{color:var(--red);}
.kl-icon{background:none;border:1px solid transparent;color:var(--ash);cursor:pointer;padding:5px;border-radius:8px;display:flex;}
.kl-icon svg{width:18px;height:18px;}
.kl-exmenu{display:flex;gap:7px;flex-wrap:wrap;background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:9px;margin-bottom:11px;}
.kl-tag{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--accent-soft);color:var(--accent);}
.kl-tag.t3{background:var(--surface2);color:var(--ash);}
.kl-tag.t2{background:var(--accent-soft);color:var(--accent);opacity:.8;}

/* preview list */
.kl-prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);}
.kl-prow:last-child{border-bottom:none;}
.kl-prow-name{font-size:14px;font-weight:600;}
.kl-prow-sub{font-size:11.5px;color:var(--ash);margin-top:3px;}
.kl-prow.dropped .kl-prow-name{text-decoration:line-through;color:var(--ash-dim);}
.kl-prow-w{font-family:var(--mono);font-size:13px;font-weight:700;white-space:nowrap;}

/* generic */
.kl-rest{display:flex;align-items:center;gap:13px;}
.kl-rest svg{width:22px;height:22px;}
.kl-banner{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.45;margin-top:12px;}
.kl-banner svg{flex-shrink:0;margin-top:1px;width:17px;height:17px;}
.kl-banner-red{background:rgba(255,107,97,.10);border:1px solid rgba(255,107,97,.30);color:var(--red);}
.kl-banner-amber{background:rgba(255,176,32,.10);border:1px solid rgba(255,176,32,.32);color:var(--amber);}

/* goals */
.kl-goal{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
.kl-goal:last-child{border-bottom:none;}
.kl-goal .kl-goal-l{flex:1;}
.kl-goal-done{color:var(--ash-dim);text-decoration:line-through;}
.kl-auto{font-size:9.5px;color:var(--ash-dim);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:6px;text-decoration:none;display:inline-block;}
.kl-check{width:24px;height:24px;border-radius:8px;border:1.6px solid var(--line);background:transparent;
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:#06240f;flex-shrink:0;transition:background .15s;}
.kl-check svg{width:15px;height:15px;}
.kl-check.on{background:var(--green);border-color:var(--green);}
.kl-del{background:none;border:none;color:var(--ash-dim);cursor:pointer;padding:4px;display:flex;}
.kl-del svg{width:17px;height:17px;}
.kl-add{display:flex;gap:8px;margin-top:12px;}
.kl-add input{flex:1;min-width:0;background:var(--ink2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--bone);font-size:14px;font-family:var(--sans);}
.kl-add input:focus{outline:none;border-color:var(--accent);}
.kl-add button{background:var(--accent);border:none;border-radius:10px;width:44px;display:flex;
  align-items:center;justify-content:center;color:var(--on-accent);cursor:pointer;flex-shrink:0;}
.kl-add button svg{width:18px;height:18px;}

/* buttons */
.kl-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:12px 15px;
  font-size:13.5px;font-weight:650;cursor:pointer;border:1px solid transparent;font-family:var(--sans);}
.kl-btn svg{width:17px;height:17px;}
.kl-btn-acc{background:var(--accent);color:var(--on-accent);}
.kl-btn-ghost{background:transparent;border-color:var(--line);color:var(--bone);}
.kl-btn-red{background:var(--red);color:#2a0a08;}
.kl-full{width:100%;}
.kl-row{display:flex;gap:9px;}
.kl-stack{display:flex;flex-direction:column;gap:9px;margin-top:14px;}

/* fields */
.kl-field{margin-bottom:14px;}
.kl-field:last-child{margin-bottom:0;}
.kl-flabel{font-size:12px;font-weight:600;color:var(--ash);margin-bottom:7px;display:flex;justify-content:space-between;}
.kl-input,.kl-select{width:100%;background:var(--ink2);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;color:var(--bone);font-size:15px;font-family:var(--sans);}
.kl-input.mono{font-family:var(--mono);}
.kl-input:focus,.kl-select:focus{outline:none;border-color:var(--accent);}
.kl-grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.kl-grid2 .kl-field{margin-bottom:0;}

/* bars */
.kl-target{margin-bottom:12px;}
.kl-target:last-child{margin-bottom:0;}
.kl-tlabel{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.kl-tlabel .mono{color:var(--ash);}
.kl-bar{height:7px;background:var(--ink2);border-radius:99px;overflow:hidden;}
.kl-bar>div{height:100%;border-radius:99px;transition:width .35s ease;}

/* chips, tabs, seg */
.kl-chip{background:var(--ink2);border:1px solid var(--line);color:var(--bone);border-radius:999px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:var(--sans);display:inline-flex;align-items:center;gap:5px;}
.kl-chip svg{width:13px;height:13px;}
.kl-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.kl-chips{display:flex;flex-wrap:wrap;gap:7px;}
.kl-add-label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ash-dim);margin:16px 0 9px;}
.kl-seg{display:flex;background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:13px;}
.kl-seg button{flex:1;background:none;border:none;color:var(--ash);border-radius:9px;padding:9px 0;font-size:12.5px;font-weight:650;cursor:pointer;font-family:var(--sans);}
.kl-seg button.on{background:var(--surface2);color:var(--bone);}
.kl-tabs2{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px;}
.kl-tab2{background:var(--ink2);border:1px solid var(--line);color:var(--ash);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:var(--sans);}
.kl-tab2.on{background:var(--surface2);color:var(--bone);border-color:var(--ash-dim);}

/* plan */
.kl-split-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.kl-split-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 12px;text-align:left;cursor:pointer;color:var(--bone);font-family:var(--sans);}
.kl-split-card.on{border-color:var(--accent);background:var(--accent-soft);}
.kl-split-label{font-size:13.5px;font-weight:700;padding-right:20px;line-height:1.3;}
.kl-split-sub{font-size:11.5px;color:var(--ash);margin-top:4px;}
.kl-split-act{position:absolute;top:10px;right:10px;width:19px;height:19px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--on-accent);}
.kl-split-act svg{width:12px;height:12px;}
.kl-split-new{border-style:dashed;color:var(--ash);display:flex;align-items:center;gap:7px;}
.kl-split-new svg{width:16px;height:16px;}
.kl-cfg-row{padding:11px 0;border-bottom:1px solid var(--line-soft);}
.kl-cfg-row:last-child{border-bottom:none;}
.kl-cfg-main{display:flex;align-items:center;gap:10px;}
.kl-cfg-name{flex:1;font-size:14px;font-weight:600;min-width:0;cursor:pointer;}
.kl-cfg-name .ash{font-size:11px;font-weight:400;margin-top:3px;}
.kl-cfg-extra{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center;}
.kl-stepper{display:flex;align-items:center;gap:9px;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:5px 7px;}
.kl-stepper button{background:none;border:none;color:var(--bone);cursor:pointer;display:flex;padding:3px;}
.kl-stepper button svg{width:15px;height:15px;}
.kl-stepper .mono{font-size:14px;font-weight:700;min-width:16px;text-align:center;}
.kl-week{display:flex;flex-direction:column;gap:7px;}
.kl-daycard{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;}
.kl-daymain{width:100%;display:flex;align-items:center;justify-content:space-between;background:none;border:none;padding:12px 14px;cursor:pointer;color:var(--bone);font-family:var(--sans);}
.kl-dayleft{display:flex;align-items:center;gap:12px;}
.kl-daydot{width:9px;height:9px;border-radius:3px;background:var(--accent);}
.kl-daydot.rest{background:var(--ash-dim);}
.kl-dayname{font-size:14px;font-weight:600;text-align:left;}
.kl-daytype{font-size:11.5px;color:var(--ash);text-align:left;margin-top:2px;}
.kl-dayopts{display:flex;flex-wrap:wrap;gap:7px;padding:0 14px 13px;}
.kl-chev{display:flex;transition:transform .2s;color:var(--ash);}
.kl-chev svg{width:18px;height:18px;}

/* muscle bars */
.kl-mrow{display:grid;grid-template-columns:118px 1fr 34px;gap:9px;align-items:center;font-size:12.5px;padding:5px 0;}
.kl-mtrack{position:relative;height:9px;background:var(--ink2);border-radius:99px;overflow:hidden;}
.kl-mzone{position:absolute;top:0;bottom:0;background:rgba(47,191,113,.16);}
.kl-mfill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;}
.kl-legend{font-size:11px;color:var(--ash-dim);margin-top:9px;line-height:1.45;}

/* analysis */
.kl-ana-top{display:flex;align-items:center;gap:6px;}
.kl-gnum{font-family:var(--mono);font-size:34px;font-weight:700;}
.kl-gcap{font-size:8.5px;letter-spacing:.2em;font-family:var(--mono);}
.kl-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.kl-stat{background:var(--ink2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;}
.kl-stat b{display:block;font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;}
.kl-stat span{font-size:11px;color:var(--ash);}
.kl-li{display:flex;gap:9px;font-size:13px;line-height:1.45;padding:8px 0;border-bottom:1px solid var(--line-soft);}
.kl-li:last-child{border-bottom:none;}
.kl-li svg{width:16px;height:16px;flex-shrink:0;margin-top:2px;}

/* calendar */
.kl-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.kl-cal-nav{background:var(--ink2);border:1px solid var(--line);color:var(--bone);border-radius:9px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.kl-cal-nav svg{width:17px;height:17px;}
.kl-cal-title{font-size:15px;font-weight:700;}
.kl-cal-dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px;}
.kl-cal-dow span{text-align:center;font-size:10.5px;color:var(--ash-dim);font-weight:600;}
.kl-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
.kl-cell{aspect-ratio:1;border-radius:10px;background:var(--ink2);border:1px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:2px;color:var(--bone);font-family:var(--sans);}
.kl-cell.empty{background:transparent;cursor:default;}
.kl-cell.today{border-color:var(--accent);}
.kl-cell.sel{background:var(--surface2);}
.kl-cell.done{box-shadow:inset 0 0 0 1.5px var(--green);}
.kl-cell-n{font-family:var(--mono);font-size:13px;}
.kl-cell-t{font-size:9px;font-weight:700;margin-top:1px;letter-spacing:.04em;}
.kl-cell-dot{position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--amber);}
.kl-cal-detail{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:14px;}
.kl-dline{font-size:12.5px;color:var(--ash);padding:4px 0;line-height:1.45;}
.kl-dline b{color:var(--bone);font-weight:600;}

/* charts */
.kl-chart{width:100%;height:auto;display:block;overflow:visible;}
.kl-chart text{font-family:var(--mono);font-size:10px;fill:var(--ash-dim);}
.kl-statline{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--ash);}
.kl-statline b{color:var(--bone);font-family:var(--mono);font-size:14px;margin-left:4px;}

/* profile */
.kl-setrow2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px;}
.kl-setrow2:last-child{border-bottom:none;}
.kl-switch{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;border:none;cursor:pointer;flex-shrink:0;transition:background .2s;}
.kl-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s;}
.kl-switch.on{background:var(--accent);}
.kl-switch.on::after{left:21px;}
.kl-sws{display:flex;flex-wrap:wrap;gap:12px;}
.kl-sw{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--ash);font-size:11px;font-family:var(--sans);padding:0;}
.kl-sw i{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);display:block;}
.kl-sw.on i{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--accent);}
.kl-sw.on{color:var(--bone);}
.kl-foot{font-size:11px;color:var(--ash-dim);margin-top:11px;text-align:center;}

/* rest timer */
.kl-restbar{display:none;flex-shrink:0;background:var(--surface2);border-top:1px solid var(--line);padding:10px 14px 11px;}
.kl-restbar.on{display:block;}
.kl-rest-row{display:flex;align-items:center;gap:12px;margin-bottom:8px;}
.kl-rest-name{font-size:12px;color:var(--ash);margin-top:2px;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kl-rest-t{font-size:26px;font-weight:700;flex:1;text-align:center;}
.kl-rest-btns{display:flex;gap:6px;}

/* sheet */
.kl-sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.kl-sheet{width:100%;max-width:480px;max-height:88%;background:var(--ink);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);}
.kl-sheet-head{padding:15px 16px 10px;border-bottom:1px solid var(--line-soft);}
.kl-sheet-list{overflow-y:auto;flex:1;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;}
.kl-pick{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:none;border:none;border-bottom:1px solid var(--line-soft);padding:11px 0;color:var(--bone);text-align:left;cursor:pointer;font-family:var(--sans);}
.kl-pick .ash{font-size:11.5px;margin-top:3px;}

var LS = "kernlast.v3", LS_OLD = "kernlast.v2";
var state = null, REST = null, AC = null, saveT = null;

function uid(){ return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4); }
function exInfo(id){ return LIB[id] || (state && state.customEx && state.customEx[id]) || {n:id,m:[],s:[],t:3,eq:"machine",r:"8-12",rest:90}; }
function sortScience(list){
  return list.map(function(e,i){ return {e:e,i:i}; })
    .sort(function(a,b){ return (exInfo(a.e.id).t-exInfo(b.e.id).t) || (a.i-b.i); })
    .map(function(x){ return x.e; });
}
function pickFor(muscles, per, existing){
  var ids = (existing||[]).slice(), added = [];
  muscles.forEach(function(mu){ var n = BIG[mu]?per:1, c=0;
    (PICK[mu]||[]).forEach(function(id){ if(c<n && ids.indexOf(id)<0){ ids.push(id); added.push(id); c++; } }); });
  return added;
}
function generateEx(muscles){
  var per = muscles.length<=4 ? 2 : 1;
  return sortScience(pickFor(muscles, per, []).map(function(id){ return {id:id,sets:3}; }));
}
function mkUnit(name,m){ return {name:name,muscles:m.slice(),ex:generateEx(m)}; }
var PRESETS = {
  ppl6:function(){ return {name:"Push / Pull / Legs",sub:"6 Tage",units:{push:mkUnit("Push",M_PUSH),pull:mkUnit("Pull",M_PULL),legs:mkUnit("Legs",M_LEGS)},

function blankDay(){ return {habits:{},custom:[],nutri:{},weight:"",meas:{},cardio:[],session:null}; }
function ensureDay(ds){
  var d = state.days[ds]; if(!d){ d = state.days[ds] = blankDay(); }
  var b = blankDay(); Object.keys(b).forEach(function(k){ if(d[k]===undefined) d[k]=b[k]; });
  return d;
}
function deepMerge(base, over){
  if(Array.isArray(over)) return over;
  if(over && typeof over==="object"){
    var out = (base && typeof base==="object" && !Array.isArray(base)) ? Object.assign({},base) : {};
    Object.keys(over).forEach(function(k){ out[k] = (base && k in base) ? deepMerge(base[k], over[k]) : over[k]; });
    return out;
  }
  return over===undefined ? base : over;
}
function mergeLoaded(p){
  var st = deepMerge(defaultState(), p);
  if(p.splits && Object.keys(p.splits).length) st.splits = p.splits;
  if(!st.splits[st.activeSplit]) st.activeSplit = Object.keys(st.splits)[0];
  st.ui = defaultUI();
  return st;
}
function migrateV2(p){
  var st = defaultState();
  if(p.profile) ["name","heightCm","goal","proteinTarget","kcalTarget","stepTarget"].forEach(function(k){
    if(p.profile[k]!=null && p.profile[k]!=="") st.profile[k]=String(p.profile[k]); });
  var catMus = {push:"chest",pull:"lats",legs:"quads",upper:"chest",lower:"quads",full:"quads"};
  if(p.customExercises) Object.keys(p.customExercises).forEach(function(id){ var c=p.customExercises[id]||{};
    st.customEx[id]=E(c.name||id,[catMus[c.cat]||"chest"],[],3,"machine",c.reps||"8-12",90); });
  var oldDays = (p.config && p.config.days) || {};
  var SL = {push:"Push",pull:"Pull",legs:"Legs",upper:"Oberkörper",lower:"Unterkörper",full:"Ganzkörper"};
  var today = todayStr();
  if(p.days) Object.keys(p.days).forEach(function(ds){
    var o = p.days[ds]; if(!o) return; var d = blankDay(), h = o.health||{};
    d.nutri = {protein:h.protein||"",kcal:h.kcal||"",steps:h.steps||""};
    if(h.weight) d.weight = String(h.weight);
    d.habits = Object.assign({}, o.habits||{});
    d.custom = (o.custom||[]).slice();
    var lg = o.log||{}, ex = [], total = 0;
    Object.keys(lg).forEach(function(id){
      var sets = (lg[id]||[]).map(function(s){ return {w:s.w==null?"":String(s.w), r:s.reps==null?"":String(s.reps), done:!!s.done, t:null}; });
      if(sets.some(function(s){ return s.done; })){ var inf = LIB[id]||st.customEx[id]||{rest:90};
        ex.push({id:id,rest:inf.rest||90,planned:sets.length,sets:sets,note:"",kind:"",last:""}); total += sets.length; }
    });
    if(ex.length){
      var t0 = parseISO(ds).getTime()+18*3600000, type = oldDays[JS_KEY[parseISO(ds).getDay()]];
      var fin = !(ds===today && !o.sessionDone);
      d.session = {uid:null,splitId:null,name:SL[type]||"Training",start:t0,end:fin?t0+3600000:null,limit:0,planned:total,ex:ex,dropped:[],removed:[]};
    }
    st.days[ds] = d;
  });
  return st;
}
function load(){
  var raw = null; try{ raw = localStorage.getItem(LS); }catch(e){}
  if(raw){ try{ state = mergeLoaded(JSON.parse(raw)); return; }catch(e){} }
  var old = null; try{ old = localStorage.getItem(LS_OLD); }catch(e){}
  if(old){ try{ state = migrateV2(JSON.parse(old)); persist(); return; }catch(e){} }
  state = defaultState();
}
function persist(){
  try{ var o = {}; Object.keys(state).forEach(function(k){ if(k!=="ui") o[k]=state[k]; }); localStorage.setItem(LS, JSON.stringify(o)); }catch(e){}
}
function save(){ clearTimeout(saveT); saveT = setTimeout(persist, 300); }

/* ============================ Helpers ============================ */
function pad(n){ return n<10?"0"+n:""+n; }
function dateStr(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ var a=s.split("-"); return new Date(+a[0], +a[1]-1, +a[2]); }
function todayStr(){ return dateStr(new Date()); }
function selDate(){ return state.ui.sel || todayStr(); }
function isToday(ds){ return ds===todayStr(); }
function longDate(d){ return WEEK[(d.getDay()+6)%7][1]+", "+d.getDate()+". "+MONTHS[d.getMonth()]; }
function shortDate(ds){ var d=parseISO(ds); return d.getDate()+"."+(d.getMonth()+1)+"."; }
function addDays(ds,n){ var d=parseISO(ds); d.setDate(d.getDate()+n); return dateStr(d); }
function mondayOf(ds){ return addDays(ds, -((parseISO(ds).getDay()+6)%7)); }
function dayIdx(ds){ var a=ds.split("-"); return Date.UTC(+a[0],+a[1]-1,+a[2])/864e5; }
function idxLabel(x){ var d=new Date(Math.round(x)*864e5); return d.getUTCDate()+"."+(d.getUTCMonth()+1)+"."; }
function num(v){ if(v===""||v===null||v===undefined) return null; var n=Number(String(v).replace(",",".")); return isNaN(n)?null:n; }
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
function fmtW(x){ return x==null ? "" : String(parseFloat((+x).toFixed(2))); }
function fmt1(x){ return (Math.round(x*10)/10).toString(); }
function fmtClock(sec){ sec=Math.max(0,Math.round(sec)); var h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return h ? h+":"+pad(m)+":"+pad(s) : m+":"+pad(s); }
function esc(v){ if(v===null||v===undefined) return ""; return (""+v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function setPath(root, path, val){
  var parts=path.split("."), o=root;
  for(var i=0;i<parts.length-1;i++){ var k=parts[i]; if(o[k]===undefined||o[k]===null) o[k]={}; o=o[k]; }
  o[parts[parts.length-1]]=val;
}
function range(id){ var r=String(exInfo(id).r||"8-12").split("-"); var a=parseInt(r[0],10)||8, b=parseInt(r[1]||r[0],10)||a; return {min:Math.min(a,b),max:Math.max(a,b),r:exInfo(id).r}; }
function incFor(id){ return INC[exInfo(id).eq]||2.5; }
function e1rm(w,r){ return r<=1 ? w : w*(1+r/30); }
function roundTo(x,inc){ return parseFloat((Math.round(x/inc)*inc).toFixed(2)); }
function hexA(hex,a){ var h=hex.replace("#",""); var n=parseInt(h,16); return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")"; }
function activeSplit(){ return state.splits[state.activeSplit] || state.splits[Object.keys(state.splits)[0]]; }
function plannedFor(ds){ var sp=activeSplit(); var u=sp.days[JS_KEY[parseISO(ds).getDay()]]||"rest"; return (u!=="rest" && sp.units[u]) ? u : "rest"; }
function curLimit(){ return state.ui.limit!=null ? state.ui.limit : (state.settings.timeLimit||0); }
function pctColor(p){ if(p===null) return "var(--ash-dim)"; if(p<50) return "var(--red)"; if(p<75) return "var(--amber)"; return "var(--green)"; }
function bodyWeight(ds){
  var keys=Object.keys(state.days).filter(function(k){ return k<=ds && num(state.days[k].weight)!=null; }).sort();
  return keys.length ? num(state.days[keys[keys.length-1]].weight) : null;
}

/* ============================ Progression ============================ */
function lastPerf(id, before){
  var keys = Object.keys(state.days).filter(function(k){ return k<before && state.days[k].session; }).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var s = state.days[keys[i]].session;
    for(var j=0;j<s.ex.length;j++){ if(s.ex[j].id!==id) continue;
      var d = s.ex[j].sets.filter(function(x){ return x.done && num(x.r)!=null; });
      if(d.length) return {ds:keys[i], sets:d};
    }
  }
  return null;
}
function suggest(id, ds){
  var last = lastPerf(id, ds), rg = range(id), inc = incFor(id);
  if(!last) return {w:null,kind:"first",note:"Erste Einheit: Gewicht wählen, bei dem 1–2 Wdh im Tank bleiben",last:""};
  var W = 0; last.sets.forEach(function(s){ var w=num(s.w)||0; if(w>W) W=w; });
  var top = last.sets.filter(function(s){ return (num(s.w)||0)===W; });
  var reps = top.map(function(s){ return num(s.r)||0; });
  var avg = reps.reduce(function(a,b){ return a+b; },0)/reps.length;
  var lastTxt = last.sets.map(function(s){ return (num(s.w)?fmtW(num(s.w)):"KG")+"×"+s.r; }).join(", ");
  var allTop = reps.every(function(r){ return r>=rg.max; });
  if(W<=0){
    return allTop ? {w:null,kind:"up",note:"Alle Sätze ≥ "+rg.max+" Wdh → Zusatzgewicht oder schwerere Variante",last:lastTxt}
                  : {w:null,kind:"hold",note:"Ziel: mehr Wdh als letztes Mal",last:lastTxt};
  }
  if(allTop) return {w:roundTo(W+inc,0.25),kind:"up",note:"Alle Sätze am oberen Ende ("+rg.max+") → +"+fmtW(inc)+" kg",last:lastTxt};
  if(avg<rg.min){
    var nw = roundTo(W*(1+avg/30)/(1+rg.min/30), inc); if(nw>=W) nw = W-inc; if(nw<0) nw = 0;
    return {w:nw,kind:"down",note:"Ø "+fmt1(avg)+" Wdh unter Ziel ("+rg.min+") → proportional auf "+fmtW(nw)+" kg",last:lastTxt};
  }
  return {w:W,kind:"hold",note:"Gewicht halten, Wdh Richtung "+rg.max+" steigern",last:lastTxt};
}
function seedSets(n, sg){ var a=[]; for(var i=0;i<n;i++) a.push({w:sg.w!=null?String(sg.w):"",r:"",done:false,t:null}); return a; }
function inSessionAdjust(ex, si){
  var s = ex.sets[si], w = num(s.w), r = num(s.r); if(!w || !r) return;
  var rg = range(ex.id), inc = incFor(ex.id), target = null;
  if(r<rg.min) target = rg.min; else if(r>=rg.max+2) target = rg.max;
  if(target===null) return;
  var nw = roundTo(w*(1+r/30)/(1+target/30), inc);
  if(target===rg.min && nw>=w) nw = w-inc;
  if(target===rg.max && nw<=w) nw = w+inc;
  if(nw<0) nw = 0;
  var changed = 0;
  for(var j=si+1;j<ex.sets.length;j++){ var x=ex.sets[j];
    if(!x.done && (x.w==="" || num(x.w)===w)){ x.w=String(nw); x.adj = nw<w?"down":"up"; changed++; } }
  if(changed) ex.hint = r+" Wdh bei "+fmtW(w)+" kg ("+(target===rg.min?"unter":"über")+" Ziel "+rg.r+") → nächste Sätze "+fmtW(nw)+" kg";
}

/* ============================ Zeitlimit ============================ */
function estEx(id,sets,rest){ var t=exInfo(id).t; return (t===1?240:t===2?90:60) + sets*(t===1?50:40) + Math.max(0,sets-1)*rest; }
function buildPlan(unit, limit){
  var items = (unit?unit.ex:[]).map(function(e,i){ var inf=exInfo(e.id);
    return {id:e.id,sets:e.sets,orig:e.sets,rest:e.rest||inf.rest,idx:i,t:inf.t}; });
  var dropped = [], reduced = [];
  function total(){ return items.reduce(function(a,it){ return a+estEx(it.id,it.sets,it.rest); },0); }
  if(limit>0 && items.length){
    var L = limit*60;
    var least = items.slice().sort(function(a,b){ return (b.t-a.t)||(b.idx-a.idx); });
    var most = least[least.length-1];
    least.forEach(function(it){ if(total()>L && it.t>=2 && it.sets>2) it.sets=2; });
    least.forEach(function(it){ if(total()>L && it!==most && items.length>1){ items.splice(items.indexOf(it),1); dropped.push(it.id); } });
    least.forEach(function(it){ if(total()>L && items.indexOf(it)>=0 && it.sets>2) it.sets=2; });
    items.forEach(function(it){ if(it.sets<it.orig) reduced.push(it.id); });
  }
  return {items:items, dropped:dropped, reduced:reduced, est:total()};
}

/* ============================ Session ============================ */
function startSession(ds, pick){
  var sp = activeSplit(), unit = (pick && pick!=="__free") ? sp.units[pick] : null;
  var limit = curLimit(), plan = buildPlan(unit, limit);
  var sess = {uid:unit?pick:null, splitId:unit?state.activeSplit:null, name:unit?unit.name:"Freies Training",
    start:Date.now(), end:null, limit:limit, planned:0, dropped:plan.dropped, removed:[], ex:[]};
  plan.items.forEach(function(it){ var sg=suggest(it.id,ds);
    sess.ex.push({id:it.id,rest:it.rest,planned:it.sets,note:sg.note,kind:sg.kind,last:sg.last,sets:seedSets(it.sets,sg)});
    sess.planned += it.sets; });
  ensureDay(ds).session = sess; state.ui.pick = null; state.ui.openEx = null;
}
function addExToSession(ds, id){
  var sess = ensureDay(ds).session; if(!sess) return; var sg = suggest(id, ds);
  sess.ex.push({id:id,rest:exInfo(id).rest,planned:0,note:sg.note,kind:sg.kind,last:sg.last,sets:seedSets(3,sg),added:true});
}
function toggleSet(ds, ei, si){
  var sess = ensureDay(ds).session; if(!sess) return; var ex = sess.ex[ei]; if(!ex) return; var s = ex.sets[si]; if(!s) return;
  if(s.done){ s.done=false; s.t=null; return; }
  if(s.r===""||s.r==null) s.r = String(range(ex.id).min);
  s.done = true; s.t = Date.now();
  inSessionAdjust(ex, si);
  if(state.settings.autoRest && sess.ex.some(function(e){ return e.sets.some(function(x){ return !x.done; }); }))
    startRest(ex.rest, exInfo(ex.id).n);
}

/* ============================ Pausen-Timer ============================ */
function unlockAudio(){
  try{ if(!AC){ var C = window.AudioContext||window.webkitAudioContext; if(C) AC = new C(); } if(AC && AC.state==="suspended") AC.resume(); }catch(e){}
}
function beep(){
  if(!AC) return;
  try{ [0,0.25,0.5].forEach(function(off){ var o=AC.createOscillator(), g=AC.createGain(); o.frequency.value=880; o.type="sine";
    g.gain.setValueAtTime(0.0001,AC.currentTime+off); g.gain.exponentialRampToValueAtTime(0.35,AC.currentTime+off+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+off+0.18); o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime+off); o.stop(AC.currentTime+off+0.2); }); }catch(e){}
}
function startRest(sec, name){ unlockAudio(); REST = {end:Date.now()+sec*1000,total:sec,name:name,fired:false}; tick(); }
function tick(){
  var el = document.getElementById("klElapsed");
  if(el){ var d = state.days[selDate()]; if(d && d.session && !d.session.end) el.textContent = fmtClock((Date.now()-d.session.start)/1000); }
  var bar = document.getElementById("klRest"); if(!bar) return;
  if(!REST){ bar.classList.remove("on"); return; }
  bar.classList.add("on");
  var left = (REST.end-Date.now())/1000, t = document.getElementById("klRestT"), f = document.getElementById("klRestF"), n = document.getElementById("klRestN");
  if(n) n.textContent = REST.name||"";
  if(left<=0){
    if(!REST.fired){ REST.fired = true; if(state.settings.sound) beep(); if(state.settings.vibrate && navigator.vibrate){ try{ navigator.vibrate([220,120,220]); }catch(e){} } }
    if(t){ t.textContent = "Los!"; t.style.color = "var(--green)"; } if(f) f.style.width = "100%";
    if(left<-6){ REST = null; bar.classList.remove("on"); }
    return;
  }
  if(t){ t.textContent = fmtClock(Math.ceil(left)); t.style.color = ""; }
  if(f) f.style.width = clamp((1-left/REST.total)*100,0,100)+"%";
}

/* ============================ Auswertung ============================ */
function bestBefore(id, ds){
  var best = 0;
  Object.keys(state.days).forEach(function(k){ if(k>=ds) return; var s=state.days[k].session; if(!s) return;
    s.ex.forEach(function(ex){ if(ex.id!==id) return; ex.sets.forEach(function(x){ var w=num(x.w), r=num(x.r);
      if(x.done && w>0 && r>0) best = Math.max(best, e1rm(w,r)); }); }); });
  return best;
}
function muscleSets(from, to){
  var out = {};
  Object.keys(state.days).forEach(function(k){ if(k<from||k>to) return; var s=state.days[k].session; if(!s) return;
    s.ex.forEach(function(ex){ var n = ex.sets.filter(function(x){ return x.done; }).length; if(!n) return; var inf=exInfo(ex.id);
      (inf.m||[]).forEach(function(m){ out[m]=(out[m]||0)+n; }); (inf.s||[]).forEach(function(m){ out[m]=(out[m]||0)+n*0.5; }); }); });
  return out;
}
function planMuscleSets(sp){
  var out = {};
  WEEK.forEach(function(w){ var u = sp.days[w[0]]; if(!u || u==="rest" || !sp.units[u]) return;
    sp.units[u].ex.forEach(function(e){ var inf=exInfo(e.id);
      (inf.m||[]).forEach(function(m){ out[m]=(out[m]||0)+e.sets; }); (inf.s||[]).forEach(function(m){ out[m]=(out[m]||0)+e.sets*0.5; }); }); });
  return out;
}
function analyze(ds, sess){
  var done=0, vol=0, inR=0, good=[], imp=[], restC=[], trained={};
  sess.ex.forEach(function(ex){
    var inf = exInfo(ex.id), rg = range(ex.id), inc = incFor(ex.id);
    var dn = ex.sets.filter(function(x){ return x.done; });
    if(!dn.length){ imp.push(inf.n+": ausgelassen. Wenn das öfter passiert, im Plan weiter nach vorne oder rausnehmen."); return; }
    done += dn.length; (inf.m||[]).forEach(function(m){ trained[m]=1; });
    var W=0, reps=[], best=0;
    dn.forEach(function(x){ var w=num(x.w)||0, r=num(x.r)||0; vol+=w*r; if(r>=rg.min) inR++; if(w>W) W=w; if(w>0&&r>0) best=Math.max(best,e1rm(w,r)); });
    dn.forEach(function(x){ if((num(x.w)||0)===W) reps.push(num(x.r)||0); });
    var avg = reps.reduce(function(a,b){ return a+b; },0)/(reps.length||1);
    var ts = dn.map(function(x){ return x.t; }).filter(Boolean).sort(function(a,b){ return a-b; });
    for(var i=1;i<ts.length;i++){ var d=(ts[i]-ts[i-1])/1000; if(d>20 && d<900 && inf.t<=2) restC.push(d); }
    if(reps.length && reps.every(function(r){ return r>=rg.max; }) && W>0) good.push(inf.n+": alle Sätze am oberen Ende. Nächstes Mal +"+fmtW(inc)+" kg.");
    else if(avg<rg.min && W>0){ var nw=roundTo(W*(1+avg/30)/(1+rg.min/30),inc); if(nw>=W) nw=W-inc;
      imp.push(inf.n+": Ø "+fmt1(avg)+" Wdh unter Ziel "+rg.min+". Nächstes Mal ca. "+fmtW(Math.max(0,nw))+" kg."); }
    if(dn.length<ex.sets.length) imp.push(inf.n+": nur "+dn.length+" von "+ex.sets.length+" Sätzen.");
    var prev = bestBefore(ex.id, ds);
    if(best>0 && prev>0 && best>prev+0.01) good.unshift("Neuer Bestwert "+inf.n+": geschätztes 1RM "+fmtW(Math.round(best*2)/2)+" kg (vorher "+fmtW(Math.round(prev*2)/2)+").");
  });
  (sess.removed||[]).forEach(function(id){ imp.push(exInfo(id).n+": während dem Training entfernt."); });
  var planned = sess.planned||0;
  var completion = planned ? Math.min(100, Math.round(done/planned*100)) : (done?100:0);
  var quality = done ? Math.round(inR/done*100) : 0;
  var dur = ((sess.end||Date.now())-sess.start)/60000;
  if(restC.length>=3){ var ar = restC.reduce(function(a,b){ return a+b; },0)/restC.length;
    if(ar<100) imp.push("Satzabstand bei Grundübungen Ø "+fmtClock(ar)+". 2–3 min Pause bringen mehr Wdh pro Satz und damit mehr Reiz.");
    else good.push("Pausen bei Grundübungen ausreichend lang (Ø "+fmtClock(ar)+")."); }
  if(sess.limit){ if(dur>sess.limit+5) imp.push("Training dauerte "+Math.round(dur-sess.limit)+" min länger als dein Limit. Pausen im Blick behalten oder Limit höher setzen.");
    else good.push("Im Zeitlimit von "+sess.limit+" min geblieben."); }
  if(done>=4){ if(quality>=85) good.push(quality+" % der Sätze im Ziel-Wdh-Bereich.");
    else if(quality<60) imp.push("Nur "+quality+" % der Sätze im Ziel-Wdh-Bereich. Gewichte etwas zurücknehmen, sauberer im Bereich bleiben."); }
  if(completion===100 && done) good.push("Alle geplanten Sätze erledigt.");
  if(!good.length && !imp.length) good.push("Sauber durchgezogen.");
  var wk = muscleSets(mondayOf(ds), ds), week = [];
  Object.keys(trained).forEach(function(m){ week.push([m, wk[m]||0]); });
  return {completion:completion,quality:quality,done:done,planned:planned,vol:vol,dur:dur,good:good,imp:imp,week:week};
}
function computeStreak(){
  var streak = 0, sp = activeSplit();
  for(var i=0;i<365;i++){
    var dt = new Date(); dt.setDate(dt.getDate()-i); var ds = dateStr(dt);
    var day = state.days[ds], hasDone = !!(day && day.session && day.session.end);
    var planned = sp.days[JS_KEY[dt.getDay()]]||"rest";
    var ok = planned==="rest" ? true : hasDone;
    if(i===0 && !ok) continue;
    if(ok) streak++; else break;
  }
  return streak;
}

/* ============================ Datenreihen ============================ */
function sortedDays(){ return Object.keys(state.days).sort(); }
function exHistory(id){
  var out = [];
  sortedDays().forEach(function(k){ var s=state.days[k].session; if(!s) return;
    s.ex.forEach(function(ex){ if(ex.id!==id) return; var best=0, top=0, vol=0, txt=[];
      ex.sets.forEach(function(x){ var w=num(x.w)||0, r=num(x.r)||0; if(!x.done) return; vol+=w*r; if(w>top) top=w; if(w>0&&r>0) best=Math.max(best,e1rm(w,r)); txt.push((w?fmtW(w):"KG")+"×"+r); });
      if(txt.length) out.push({ds:k,x:dayIdx(k),y:Math.round(best*10)/10,top:top,vol:vol,txt:txt.join(", ")}); }); });
  return out;
}
function exWithHistory(){
  var ids = {};
  Object.keys(state.days).forEach(function(k){ var s=state.days[k].session; if(!s) return;
    s.ex.forEach(function(ex){ if(ex.sets.some(function(x){ return x.done; })) ids[ex.id]=1; }); });
  return Object.keys(ids).sort(function(a,b){ return exInfo(a).n.localeCompare(exInfo(b).n); });
}
function seriesFrom(getter, days){
  var from = days ? addDays(todayStr(), -days+1) : "0000";
  return sortedDays().filter(function(k){ return k>=from && getter(state.days[k])!=null; })
    .map(function(k){ return {ds:k,x:dayIdx(k),y:getter(state.days[k])}; });
}
function weeks(n){ var out=[], m=mondayOf(todayStr()); for(var i=n-1;i>=0;i--){ var f=addDays(m,-7*i); out.push([f,addDays(f,6)]); } return out; }
function sumDays(from,to,fn){ var t=0; Object.keys(state.days).forEach(function(k){ if(k>=from&&k<=to) t+=fn(state.days[k])||0; }); return t; }
function cardioMin(d){ return (d.cardio||[]).reduce(function(a,c){ return a+(num(c.min)||0); },0); }
function tonnage(d){ var s=d.session; if(!s) return 0; var t=0; s.ex.forEach(function(ex){ ex.sets.forEach(function(x){ if(x.done) t+=(num(x.w)||0)*(num(x.r)||0); }); }); return t; }
function cardioKcal(c, ds){ var bw = bodyWeight(ds)||75; var met=(CMAP[c.type]||CMAP.other).met*(INTS[c.int]||INTS[2])[1]; return Math.round(met*bw*(num(c.min)||0)/60); }

/* ============================ Charts ============================ */
function niceTicks(mn,mx,n){
  var span = mx-mn; if(span<=0) span = Math.abs(mx)||1;
  var step = Math.pow(10, Math.floor(Math.log(span/n)/Math.LN10)), err = span/n/step;
  if(err>=7.5) step*=10; else if(err>=3.5) step*=5; else if(err>=1.5) step*=2;
  var lo = Math.floor(mn/step)*step, hi = Math.ceil(mx/step)*step, t = [];
  for(var v=lo; v<=hi+step/2; v+=step) t.push(parseFloat(v.toFixed(6)));
  if(t.length<2) t.push(parseFloat((lo+step).toFixed(6)));
  return t;
}
function lineChart(pts, o){
  o = o||{};
  if(pts.length<2) return '<div class="kl-empty">'+(o.empty||"Noch zu wenig Daten. Ab zwei Einträgen erscheint hier der Verlauf.")+'</div>';
  var W=340, H=o.h||170, L=38, R=10, T=12, B=24;
  var avg = null;
  if(o.avg){ avg = pts.map(function(p){ var w=pts.filter(function(q){ return q.x<=p.x && q.x>p.x-7; }); return {x:p.x,y:w.reduce(function(a,q){ return a+q.y; },0)/w.length}; }); }
  var ys = pts.map(function(p){ return p.y; }); if(o.goal!=null) ys.push(o.goal);
  var x0 = pts[0].x, x1 = pts[pts.length-1].x; if(x1===x0) x1 = x0+1;
  var mn = Math.min.apply(null,ys), mx = Math.max.apply(null,ys), py = (mx-mn)*0.12 || Math.max(1,Math.abs(mx)*0.02);
  var ticks = niceTicks(mn-py, mx+py, 4), y0 = ticks[0], y1 = ticks[ticks.length-1];
  function X(x){ return L+(x-x0)/(x1-x0)*(W-L-R); }
  function Y(y){ return T+(1-(y-y0)/(y1-y0))*(H-T-B); }
  var g = '';
  ticks.forEach(function(t){ g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'" style="stroke:var(--line-soft)" stroke-width="1"/>'
    +'<text x="'+(L-6)+'" y="'+(Y(t)+3.5).toFixed(1)+'" text-anchor="end">'+fmtW(t)+'</text>'; });
  [x0,(x0+x1)/2,x1].forEach(function(x,i){ g += '<text x="'+X(x).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+(i===0?"start":i===2?"end":"middle")+'">'+idxLabel(x)+'</text>'; });
  if(o.goal!=null) g += '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.goal).toFixed(1)+'" y2="'+Y(o.goal).toFixed(1)+'" style="stroke:var(--green)" stroke-width="1.2" stroke-dasharray="4 4"/>';
  function path(arr){ return arr.map(function(p,k){ return (k?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1); }).join(" "); }
  var main = avg || pts;
  if(avg) g += pts.map(function(p){ return '<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.4" style="fill:var(--ash-dim)"/>'; }).join("");
  g += '<path d="'+path(main)+'" fill="none" style="stroke:var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
  if(!avg && pts.length<=40) g += pts.map(function(p){ return '<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" style="fill:var(--accent)"/>'; }).join("");
  var lp = main[main.length-1];
  g += '<circle cx="'+X(lp.x).toFixed(1)+'" cy="'+Y(lp.y).toFixed(1)+'" r="4.5" style="fill:var(--accent);stroke:var(--surface)" stroke-width="2"/>';
  return '<svg class="kl-chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function barChart(labels, vals, o){
  o = o||{};
  if(!vals.some(function(v){ return v>0; })) return '<div class="kl-empty">'+(o.empty||"Noch keine Daten in diesem Zeitraum.")+'</div>';
  var W=340, H=o.h||150, L=6, R=6, T=16, B=22, n=vals.length, mx=Math.max.apply(null,vals)||1;
  var bw = (W-L-R)/n, g = '';
  vals.forEach(function(v,i){ var h=(v/mx)*(H-T-B), x=L+i*bw+bw*0.18, w=bw*0.64, y=H-B-h;
    g += '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+Math.max(h,v>0?2:0).toFixed(1)+'" rx="4" style="fill:'+(i===n-1?"var(--accent)":hexA(accentHex(),0.45))+'"/>';
    if(v>0) g += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+(o.fmt?o.fmt(v):Math.round(v))+'</text>';
    g += '<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+labels[i]+'</text>'; });
  return '<svg class="kl-chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}
function gauge(pct, cap){
  var r=64, C=2*Math.PI*r, arc=0.75, val=(pct===null?0:pct/100), col=pctColor(pct);
  return '<svg viewBox="0 0 160 160" width="150" height="150" style="flex-shrink:0">'
    +'<g transform="rotate(135 80 80)">'
    +'<circle cx="80" cy="80" r="64" fill="none" style="stroke:var(--line)" stroke-width="13" stroke-dasharray="'+(arc*C)+' '+C+'" stroke-linecap="round"/>'
    +'<circle cx="80" cy="80" r="64" fill="none" style="stroke:'+col+';transition:stroke-dasharray .6s ease" stroke-width="13" stroke-dasharray="'+(val*arc*C)+' '+C+'" stroke-linecap="round"/>'
    +'</g>'
    +'<text x="80" y="78" text-anchor="middle" class="kl-gnum" style="fill:var(--bone)">'+(pct===null?"--":pct+"%")+'</text>'
    +'<text x="80" y="99" text-anchor="middle" class="kl-gcap" style="fill:var(--ash)">'+cap+'</text></svg>';
}
function muscleBars(map, keys){
  var MAXS = 24;
  var rows = keys.map(function(m){ var v=map[m]||0, pct=clamp(v/MAXS*100,0,100);

/* ============================ Theme ============================ */
function accentHex(){
  var m = MODES[state.settings.mode]||MODES.nacht, a = state.settings.accent;
  if(a==="mono") return m.dark ? "#F4F4F5" : "#111113";
  if(a==="grau" && !m.dark) return "#6B7280";
  return (ACCENTS[a]||ACCENTS.blau)[1];
}
function applyTheme(){
  var m = MODES[state.settings.mode]||MODES.nacht, s = document.documentElement.style, acc = accentHex();
  var on = (state.settings.accent==="mono" || state.settings.accent==="grau") ? (m.dark?"#000":"#fff") : "#fff";
  s.setProperty("--bg",m.bg); s.setProperty("--ink",m.ink); s.setProperty("--ink2",m.ink2); s.setProperty("--surface",m.surface);
  s.setProperty("--surface2",m.surface2); s.setProperty("--line",m.line); s.setProperty("--line-soft",m.lineSoft);
  s.setProperty("--bone",m.text); s.setProperty("--ash",m.ash); s.setProperty("--ash-dim",m.ashDim);
  s.setProperty("--accent",acc); s.setProperty("--accent-soft",hexA(acc,m.dark?0.14:0.12)); s.setProperty("--on-accent",on);
  s.setProperty("--green", m.dark?"#2FBF71":"#16A34A"); s.setProperty("--amber", m.dark?"#FFB020":"#C27803"); s.setProperty("--red", m.dark?"#FF6B61":"#DC2626");
  s.colorScheme = m.dark ? "dark" : "light";
  var tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.setAttribute("content", m.ink);
}

/* ============================ Shell ============================ */
function chip(label, on, action){ return '<button class="kl-chip'+(on?" on":"")+'" data-action="'+action+'">'+label+'</button>'; }
function shell(content){
  var sel = selDate(), streak = computeStreak();
  var back = isToday(sel) ? "" : '<button class="kl-backtoday" data-action="backtoday">heute</button>';
  var tabs = [["today","Heute",I.heart],["calendar","Kalender",I.cal],["progress","Fortschritt",I.chart],["plan","Plan",I.dumbbell],["profile","Profil",I.user]];
  var nav = tabs.map(function(t){ return '<button class="kl-tab '+(state.ui.tab===t[0]?"on":"")+'" data-action="tab:'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>'; }).join("");
  var sc = streak>0 ? "var(--amber)" : "var(--ash-dim)";
  return '<div class="kl-shell">'
    +'<header class="kl-header"><div><div class="kl-brand">KERNLAST</div><div class="kl-date">'+longDate(parseISO(sel))+back+'</div></div>'
    +'<div class="kl-streak" title="Serie: Tage im Plan"><span style="color:'+sc+';display:flex">'+I.flame+'</span><span class="mono" style="color:'+sc+'">'+streak+'</span></div></header>'

    +'<div class="kl-bar"><div id="klRestF" style="width:0%;background:var(--accent)"></div></div></div>'

function viewHTML(){
  switch(state.ui.tab){

/* ============================ Heute ============================ */
function renderToday(){
  var ds = selDate(), day = ensureDay(ds), sess = day.session, h = '<div class="kl-page">';

}
function kindColor(k){ return k==="up" ? "var(--green)" : k==="down" ? "var(--amber)" : "var(--ash)"; }
function kindArrow(k){ return k==="up" ? "↑" : k==="down" ? "↓" : k==="hold" ? "→" : "•"; }

function planDiffers(sess){
  if(!sess.uid || !sess.splitId || !state.splits[sess.splitId] || !state.splits[sess.splitId].units[sess.uid]) return false;
  var u = state.splits[sess.splitId].units[sess.uid];
  if((sess.removed||[]).length) return true;
  if(sess.ex.some(function(e){ return e.added || e.sets.length!==e.planned; })) return true;
  var a = sess.ex.map(function(e){ return e.id; }).join("|");
  var b = u.ex.filter(function(e){ return (sess.dropped||[]).indexOf(e.id)<0; }).map(function(e){ return e.id; }).join("|");
  return a!==b;
}
function applyPlan(sess){
  var u = state.splits[sess.splitId].units[sess.uid];
  var orig = {}; u.ex.forEach(function(e){ orig[e.id]=e; });
  var list = sess.ex.map(function(e){ var o=orig[e.id];
    var sets = (o && !e.added && e.sets.length===e.planned) ? o.sets : e.sets.length;
    return {id:e.id,sets:Math.max(1,sets),rest:e.rest}; });
  (sess.dropped||[]).forEach(function(id){ if(orig[id] && !list.some(function(x){ return x.id===id; })) list.push(orig[id]); });
  u.ex = list;
}

function autoDone(id, d){

    case "steps": return num(p.stepTarget)>0 && num(n.steps)>=num(p.stepTarget);

/* ============================ Events ============================ */
function curSess(){ return ensureDay(selDate()).session; }
function moveItem(arr, i, d){ var j=i+d; if(j<0||j>=arr.length) return false; var t=arr[i]; arr[i]=arr[j]; arr[j]=t; return true; }
function val(id){ var el=document.getElementById(id); return el ? el.value.trim() : ""; }
function stashCardio(){ state.ui.cDraft = {min:val("klCMin"),km:val("klCKm"),note:val("klCNote")}; }

function onInput(e){
  var t = e.target;
  if(t.id==="klSearch"){ filterSheet(t.value); return; }
  var b = t.getAttribute && t.getAttribute("data-b"); if(!b) return;
  var i = b.indexOf(":"), scope = b.slice(0,i), path = b.slice(i+1), v = t.value;
  if(scope==="set"){
    var p = path.split(":"), sess = curSess();
    if(sess && sess.ex[+p[0]] && sess.ex[+p[0]].sets[+p[1]]){ var s = sess.ex[+p[0]].sets[+p[1]]; s[p[2]] = v.replace(",","."); if(p[2]==="w") s.adj = null; }
    save(); return;
  }
  var root = scope==="day" ? ensureDay(selDate()) : scope==="ui" ? state.ui : state;
  setPath(root, path, (t.getAttribute("inputmode")==="decimal") ? v.replace(",",".") : v);
  save();
  if(t.getAttribute("data-live")==="nutri") refreshNutri();
  if(e.type==="change" && t.hasAttribute("data-rr")) deferRender();
}
var lastDown = 0;
function deferRender(){ if(Date.now()-lastDown<700) setTimeout(function(){ render(); }, 420); else render(); }

function onClick(e){
  unlockAudio();
  var b = e.target.closest("[data-action]"); if(!b) return;
  var p = b.getAttribute("data-action").split(":"), a = p[0], ds = selDate(), sp = activeSplit(), sess, ex, u, k, i;
  if(a==="sheetbg"){ if(e.target===b){ state.ui.sheet=null; render(); } return; }
  switch(a){
    case "tab": state.ui.tab=p[1]; state.ui.confirm=null; state.ui.sheet=null; render(true); return;
    case "backtoday": state.ui.sel=null; state.ui.pick=null; render(true); return;
    case "goprofile": state.ui.tab="profile"; render(true); return;
    /* Training */
    case "pick": state.ui.pick={ds:ds,uid:p[1]}; render(); return;
    case "limit": state.ui.limit=+p[1]; render(); return;
    case "start": startSession(ds, p[1]); save(); render(true); return;
    case "sdone": toggleSet(ds, +p[1], +p[2]); save(); render(); return;
    case "addset": sess=curSess(); ex=sess&&sess.ex[+p[1]]; if(ex){ var ls=ex.sets[ex.sets.length-1]; ex.sets.push({w:ls?ls.w:"",r:"",done:false,t:null}); } save(); render(); return;
    case "rmset": sess=curSess(); ex=sess&&sess.ex[+p[1]]; if(ex && ex.sets.length>1){ var idx=-1; for(i=ex.sets.length-1;i>=0;i--){ if(!ex.sets[i].done){ idx=i; break; } } ex.sets.splice(idx>=0?idx:ex.sets.length-1,1); } save(); render(); return;
    case "exmenu": state.ui.openEx = state.ui.openEx===+p[1] ? null : +p[1]; render(); return;
    case "exup": case "exdown": sess=curSess(); if(sess && moveItem(sess.ex, +p[1], a==="exup"?-1:1)) state.ui.openEx = +p[1]+(a==="exup"?-1:1); save(); render(); return;
    case "exrest": sess=curSess(); ex=sess&&sess.ex[+p[1]]; if(ex) ex.rest=clamp(ex.rest+(+p[2]),15,600); save(); render(); return;
    case "exdel": sess=curSess(); if(sess){ var rm=sess.ex.splice(+p[1],1)[0]; if(rm && !rm.added){ sess.removed=sess.removed||[]; sess.removed.push(rm.id); } } state.ui.openEx=null; save(); render(); return;
    case "restnow": sess=curSess(); ex=sess&&sess.ex[+p[1]]; if(ex) startRest(ex.rest, exInfo(ex.id).n); return;
    case "rest": if(!REST) return; if(p[1]==="skip") REST=null; else { var dl=+p[1]; REST.end+=dl*1000; REST.total=Math.max(5,REST.total+dl); if(REST.end>Date.now()) REST.fired=false; } tick(); return;
    case "finish": sess=curSess(); if(sess){ sess.end=Date.now(); } REST=null; state.ui.showDetail=false; state.ui.openEx=null; save(); render(true); return;
    case "askdiscard": state.ui.confirm="discard"; render(); return;
    case "cancelconfirm": state.ui.confirm=null; render(); return;
    case "dodiscard": ensureDay(ds).session=null; REST=null; state.ui.confirm=null; save(); render(true); return;
    case "reopen": sess=curSess(); if(sess) sess.end=null; save(); render(); return;
    case "detail": state.ui.showDetail=!state.ui.showDetail; render(); return;
    case "applyplan": sess=curSess(); if(sess && planDiffers(sess)) applyPlan(sess); save(); render(); return;
    /* Sheet */
    case "sheet": state.ui.sheet={mode:p[1],q:"",mus:"",form:false}; render(); return;
    case "sheetclose": state.ui.sheet=null; render(); return;
    case "sheetmus": state.ui.sheet.mus=p[1]||""; render(); return;
    case "sheetform": state.ui.sheet.form=!state.ui.sheet.form; render(); return;
    case "addex": addExTarget(p[1]); state.ui.sheet=null; save(); render(); return;
    case "createcustom": {
      var nm=val("klCxName"); if(!nm){ var ni=document.getElementById("klCxName"); if(ni) ni.focus(); return; }
      var reps=val("klCxReps").replace(/\s/g,"")||"8-12"; if(!/^\d+(-\d+)?$/.test(reps)) reps="8-12";
      var nid="cx"+uid(); state.customEx[nid]=E(nm,[val("klCxMus")||"chest"],[],+val("klCxTier")||3,val("klCxEq")||"machine",reps,clamp(num(val("klCxRest"))||90,15,600));
      addExTarget(nid); state.ui.sheet=null; save(); render(); return; }
    /* Cardio */
    case "cardioopen": state.ui.cardioForm=true; state.ui.cDraft=null; render(); return;
    case "cardiotype": stashCardio(); state.ui.cardioType=p[1]; render(); restoreCardio(); return;
    case "cardioint": stashCardio(); state.ui.cardioInt=+p[1]; render(); restoreCardio(); return;
    case "cardiocancel": state.ui.cardioForm=false; state.ui.cDraft=null; render(); return;
    case "cardiosave": {
      var mn=num(val("klCMin")); if(!mn||mn<=0){ var mi=document.getElementById("klCMin"); if(mi){ mi.focus(); mi.style.borderColor="var(--red)"; } return; }
      ensureDay(ds).cardio.push({id:uid(),type:state.ui.cardioType,min:String(mn),km:val("klCKm").replace(",","."),int:state.ui.cardioInt,note:val("klCNote")});
      state.ui.cardioForm=false; state.ui.cDraft=null; save(); render(); return; }
    case "cardiodel": { var dd=ensureDay(ds); dd.cardio=dd.cardio.filter(function(c){ return c.id!==p[1]; }); save(); render(); return; }
    /* Ziele */
    case "goal": { var d0=ensureDay(ds);
      if(p[1]==="h") d0.habits[p[2]]=!d0.habits[p[2]];
      else d0.custom=d0.custom.map(function(c){ return c.id===p[2] ? Object.assign({},c,{done:!c.done}) : c; });
      save(); render(); return; }
    case "addgoal": { var gv=val("klNewGoal"); if(gv){ ensureDay(ds).custom.push({id:uid(),label:gv,done:false}); save(); render(); } return; }
    case "delgoal": { var d1=ensureDay(ds); d1.custom=d1.custom.filter(function(c){ return c.id!==p[1]; }); save(); render(); return; }
    case "habit": { var hi=state.habits.indexOf(p[1]); if(hi>=0) state.habits.splice(hi,1); else state.habits.push(p[1]); save(); render(); return; }
    case "addhabit": { var hv=val("klNewHabit"); if(hv){ var hid="ch"+uid(); state.customHabits.push({id:hid,label:hv}); state.habits.push(hid); save(); render(); } return; }
    case "delhabit": state.customHabits=state.customHabits.filter(function(x){ return x.id!==p[1]; }); state.habits=state.habits.filter(function(x){ return x!==p[1]; }); save(); render(); return;
    /* Kalender */
    case "calprev": case "calnext": { var c=state.ui.cal, mo=c.m+(a==="calprev"?-1:1), yy=c.y; if(mo<0){ mo=11; yy--; } if(mo>11){ mo=0; yy++; } state.ui.cal={y:yy,m:mo}; render(); return; }
    case "calsel": state.ui.sel = p[1]===todayStr() ? null : p[1]; state.ui.pick=null; render(); return;
    case "opensel": state.ui.tab="today"; render(true); return;
    /* Fortschritt */
    case "prog": state.ui.prog=p[1]; render(true); return;
    case "range": state.ui.range=+p[1]; render(); return;
    case "meas": state.ui.meas=p[1]; render(); return;
    /* Plan */
    case "split": state.activeSplit=p[1]; state.ui.editUnit=null; state.ui.newUnit=null; state.ui.openRow=null; state.ui.confirm=null; save(); render(); return;
    case "newsplit": k="s"+uid(); state.splits[k]={name:"Mein Split",sub:"",units:{},days:{mon:"rest",tue:"rest",wed:"rest",thu:"rest",fri:"rest",sat:"rest",sun:"rest"}};
      state.activeSplit=k; state.ui.newUnit={muscles:[],name:""}; state.ui.editUnit=null; save(); render(); return;
    case "addpreset": if(PRESETS[p[1]]){ state.splits[p[1]]=PRESETS[p[1]](); state.activeSplit=p[1]; state.ui.editUnit=null; } save(); render(); return;
    case "asksplitdel": state.ui.confirm="splitdel"; render(); return;
    case "dosplitdel": if(Object.keys(state.splits).length>1){ delete state.splits[state.activeSplit]; state.activeSplit=Object.keys(state.splits)[0]; } state.ui.confirm=null; state.ui.editUnit=null; save(); render(true); return;
    case "openday": state.ui.openDay = state.ui.openDay===p[1] ? null : p[1]; render(); return;
    case "setday": sp.days[p[1]]=p[2]; state.ui.openDay=null; save(); render(); return;
    case "unit": state.ui.editUnit=p[1]; state.ui.newUnit=null; state.ui.openRow=null; state.ui.confirm=null; render(); return;
    case "newunit": state.ui.newUnit={muscles:[],name:""}; state.ui.confirm=null; render(); return;
    case "cancelunit": state.ui.newUnit=null; render(); return;
    case "numus": { var nu=state.ui.newUnit||(state.ui.newUnit={muscles:[],name:""}); nu.name=val("klNewUnitName"); i=nu.muscles.indexOf(p[1]); if(i>=0) nu.muscles.splice(i,1); else nu.muscles.push(p[1]); render(); return; }
    case "createunit": { var nu2=state.ui.newUnit||{muscles:[]}; var uname=val("klNewUnitName")||("Einheit "+(Object.keys(sp.units).length+1));
      k="u"+uid(); sp.units[k]={name:uname,muscles:nu2.muscles.slice(),ex:generateEx(nu2.muscles)}; state.ui.editUnit=k; state.ui.newUnit=null; save(); render(); return; }
    case "unitmus": { k=editUnitKey(); if(!k) return; u=sp.units[k]; u.muscles=u.muscles||[]; i=u.muscles.indexOf(p[1]);
      if(i>=0){ u.muscles.splice(i,1); u.ex=u.ex.filter(function(e){ return (exInfo(e.id).m||[])[0]!==p[1]; }); }
      else { u.muscles.push(p[1]); var add=pickFor([p[1]], u.muscles.length<=4?2:1, u.ex.map(function(e){ return e.id; })); u.ex=sortScience(u.ex.concat(add.map(function(id){ return {id:id,sets:3}; }))); }
      save(); render(); return; }
    case "regen": k=editUnitKey(); if(k){ sp.units[k].ex=generateEx(sp.units[k].muscles||[]); state.ui.openRow=null; } save(); render(); return;
    case "sortsci": k=editUnitKey(); if(k){ sp.units[k].ex=sortScience(sp.units[k].ex); state.ui.openRow=null; } save(); render(); return;
    case "urow": state.ui.openRow = state.ui.openRow===+p[1] ? null : +p[1]; render(); return;
    case "usets": k=editUnitKey(); if(k){ var ue=sp.units[k].ex[+p[1]]; if(ue) ue.sets=clamp(ue.sets+(+p[2]),1,10); } save(); render(); return;
    case "urest": k=editUnitKey(); if(k){ var ur=sp.units[k].ex[+p[1]]; if(ur) ur.rest=clamp((ur.rest||exInfo(ur.id).rest)+(+p[2]),15,600); } save(); render(); return;
    case "uup": case "udown": k=editUnitKey(); if(k && moveItem(sp.units[k].ex, +p[1], a==="uup"?-1:1)) state.ui.openRow = +p[1]+(a==="uup"?-1:1); save(); render(); return;
    case "udel": k=editUnitKey(); if(k) sp.units[k].ex.splice(+p[1],1); state.ui.openRow=null; save(); render(); return;
    case "askunitdel": state.ui.confirm="unitdel"; render(); return;
    case "dounitdel": k=editUnitKey(); if(k){ delete sp.units[k]; Object.keys(sp.days).forEach(function(dk){ if(sp.days[dk]===k) sp.days[dk]="rest"; }); } state.ui.confirm=null; state.ui.editUnit=null; save(); render(); return;
    /* Einstellungen */
    case "deflimit": state.settings.timeLimit=+p[1]; state.ui.limit=null; save(); render(); return;
    case "toggle": state.settings[p[1]]=!state.settings[p[1]]; save(); render(); return;
    case "mode": state.settings.mode=p[1]; save(); render(); return;
    case "accent": state.settings.accent=p[1]; save(); render(); return;
    case "export": doExport(); return;
    case "import": document.getElementById("klImportFile").click(); return;
    case "askreset": state.ui.confirm="reset"; render(); return;
    case "doreset": state=defaultState(); REST=null; try{ localStorage.removeItem(LS); }catch(err){} persist(); render(true); return;
  }
}
function restoreCardio(){
  var d = state.ui.cDraft; if(!d) return;
  [["klCMin","min"],["klCKm","km"],["klCNote","note"]].forEach(function(x){ var el=document.getElementById(x[0]); if(el) el.value=d[x[1]]||""; });
}
function doExport(){
  try{
    var o = {}; Object.keys(state).forEach(function(k){ if(k!=="ui") o[k]=state[k]; });
    var blob = new Blob([JSON.stringify(o,null,2)],{type:"application/json"});
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "kernlast-backup-"+todayStr()+".json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }catch(e){}
}
function onImport(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      if(o && o.v===3 && o.splits) state = mergeLoaded(o);
      else if(o && (o.config || o.days)) state = migrateV2(o);
      else { alert("Diese Datei ist kein Kernlast-Backup."); return; }
      persist(); render(true);
    }catch(err){ alert("Backup konnte nicht gelesen werden: Datei ist beschädigt oder kein JSON."); }
  };
  r.readAsText(f); e.target.value = "";
}

/* ============================ Init ============================ */
function init(){
  load();
  var app = document.getElementById("app");
  app.addEventListener("click", onClick);
  document.addEventListener("pointerdown", function(){ lastDown = Date.now(); }, true);
  document.addEventListener("touchstart", function(){ lastDown = Date.now(); }, {capture:true,passive:true});
  app.addEventListener("input", onInput);
  app.addEventListener("change", onInput);
  document.getElementById("klImportFile").addEventListener("change", onImport);
  document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="hidden") persist(); else tick(); });
  window.addEventListener("pagehide", persist);
  render(true);
  setInterval(tick, 500);
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(function(){}); }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", init); else init();

})();
</script>
